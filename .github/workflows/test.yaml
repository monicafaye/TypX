name: Build and Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23.x', '1.24.x']
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Generate runtime headers
        run: go generate ./runtime

      - name: Build
        run: go build -trimpath ./cmd/typx

      - name: Test
        run: go test ./...

      - name: Test (race)
        if: runner.os == 'Linux'
        run: CGO_ENABLED=1 go test -race ./...
