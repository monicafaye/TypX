name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Generate runtime headers
        run: go generate ./runtime

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            VERSION="0.0.0-$(git rev-parse --short HEAD)"
          fi
          HASH="$(git rev-parse --short HEAD)"
          DATE="$(go run tools/build-date.go)"
          LDFLAGS="-s -w -X github.com/monicafaye/TypX/internal/util.TypXVersion=${VERSION} -X github.com/monicafaye/TypX/internal/util.CommitHash=${HASH} -X 'github.com/monicafaye/TypX/internal/util.CompileDate=${DATE}'"

          mkdir -p dist
          TARGETS=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
          )

          for target in "${TARGETS[@]}"; do
            read -r GOOS GOARCH <<< "${target}"
            STAGE="typx-${VERSION}-${GOOS}-${GOARCH}"
            mkdir -p "dist/${STAGE}"
            BIN="typx"
            if [ "${GOOS}" = "windows" ]; then
              BIN="typx.exe"
            fi

            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags "${LDFLAGS}" -o "dist/${STAGE}/${BIN}" ./cmd/typx

            cp LICENSE LICENSE-MICRO LICENSE-THIRD-PARTY README.md "dist/${STAGE}/"

            if [ "${GOOS}" = "windows" ]; then
              (cd dist && zip -qr "${STAGE}.zip" "${STAGE}")
            else
              tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
            fi
            rm -rf "dist/${STAGE}"
          done

          (cd dist && sha256sum typx-* > SHA256SUMS.txt)

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
